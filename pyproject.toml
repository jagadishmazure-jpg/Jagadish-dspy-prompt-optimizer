[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dspyopt"
version = "0.1.0"
description = "Programmatic prompt optimization in the DSPy spirit: self-improving prompts without hand-tuning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.hatch.build.targets.wheel]
packages = ["dspyopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E741", "B905"]
